name: publish-ghcr
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:eval
      - name: Publish packages to GitHub Packages
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GHCR_TOKEN }}
          pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag latest
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}