name: publish-ghcr
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:eval
      - name: Publish packages to GitHub Packages
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GHCR_TOKEN }}
          pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag latest
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      # Optional: also publish to the public npm registry (registry.npmjs.org).
      # Skipped automatically if the NPM_TOKEN secret is not configured, so the
      # workflow still works for maintainers who only want GitHub Packages.
      # To enable:
      #   1. Create an npmjs.com account / org at https://www.npmjs.com
      #   2. Generate an automation token (npm token create --workflow=automation)
      #   3. Add NPM_TOKEN to this repo's secrets (Settings → Secrets → Actions)
      #   4. Register the @loshu89 scope on npm if not already claimed
      # Once NPM_TOKEN is set, future tagged releases publish to both registries.
      - name: Publish packages to npmjs.com
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag latest --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}