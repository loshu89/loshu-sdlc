name: publish-ghcr
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:eval
      - name: Publish packages to GitHub Packages
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GHCR_TOKEN }}
          pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag latest
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      # Optional: also publish to the public npm registry (registry.npmjs.org).
      # Skipped automatically if the NPM_TOKEN secret is not configured, so the
      # workflow still works for maintainers who only want GitHub Packages.
      # To enable:
      #   1. Create an npmjs.com account / org at https://www.npmjs.com
      #   2. Generate an automation token (npm token create --workflow=automation)
      #   3. Add NPM_TOKEN to this repo's secrets (Settings → Secrets → Actions)
      #   4. Register the @loshu89 scope on npm if not already claimed
      # Once NPM_TOKEN is set, future tagged releases publish to both registries.
      - name: Publish packages to npmjs.com
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured, skipping npmjs.com publish"
            exit 0
          fi
          # Bypass npm's config system entirely. npm 10's registry resolution
          # keeps routing @loshu89/* to GH Packages in this job despite
          # --registry / NPM_CONFIG_REGISTRY / fresh HOME. So: use `npm pack`
          # to build the tarball in cwd, then `curl` PUT to npmjs.com with
          # Bearer auth. Unambiguous.
          for pkg in packages/cli packages/plugin packages/templates; do
            echo "Publishing $pkg..."
            (cd "$pkg" && \
              name=$(node -p "require('./package.json').name") && \
              encoded=$(node -p "encodeURIComponent('$name')") && \
              tarball=$(npm pack 2>/dev/null | tr -d '\n') && \
              echo "  tarball: $tarball" && \
              http_code=$(curl -sS -o /tmp/curl-body -w "%{http_code}" -X PUT \
                -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$tarball" \
                "https://registry.npmjs.org/$encoded") && \
              echo "  http: $http_code" && \
              cat /tmp/curl-body && echo && \
              rm -f "$tarball" && \
              if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then \
                echo "  -> $name published to npmjs.com"; \
              else \
                echo "  -> $name FAILED"; \
                exit 1; \
              fi)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build a self-contained CLI tarball and attach it to the GitHub Release.
      # Useful for users who can't or won't use npmjs.com / GitHub Packages
      # (e.g., users in regions where registration is restricted, or orgs
      # that forbid installing from public registries).
      #
      # Resulting tarball structure (npm-installable):
      #   package/
      #   ├── package.json
      #   ├── dist/         (compiled CLI + scaffolder)
      #   ├── plugin/       (bundled plugin contents)
      #   └── templates/    (bundled starter templates — CLI resolves these
      #                      via a relative path from dist/commands/create.js)
      #
      # Install with:
      #   npm install -g https://github.com/loshu89/loshu-sdlc/releases/download/<TAG>/cli-v${GITHUB_REF_NAME}.tar.gz
      - name: Build CLI release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p release-assets/staging/package
          cp packages/cli/package.json release-assets/staging/package/
          cp -r packages/cli/dist release-assets/staging/package/dist
          cp -r packages/cli/plugin release-assets/staging/package/plugin
          cp -r packages/templates release-assets/staging/package/templates
          # Templates are bundled, so the @loshu89/templates workspace dep is
          # no longer needed at runtime — strip it from the staged manifest.
          node -e "
            const fs = require('fs');
            const path = 'release-assets/staging/package/package.json';
            const p = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (p.dependencies) delete p.dependencies['@loshu89/templates'];
            fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
          "
          tar -czf release-assets/cli-${GITHUB_REF_NAME}.tar.gz \
            -C release-assets/staging package
          rm -rf release-assets/staging
          ls -la release-assets/

      - name: Upload CLI tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/cli-${GITHUB_REF_NAME}.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}