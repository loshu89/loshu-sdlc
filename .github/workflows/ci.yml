name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build, Typecheck, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # Tests import from packages/cli/dist/ (built artifacts) — the
          # T7 closed-loop test plus the migrate + repair CLI integration
          # tests need the dist tree. pnpm build above produces it.
          # No additional flag needed; this env block is for future overrides.
          CI_NODE_PATH: ${{ runner.temp }}/_npath

      - name: Lint
        run: pnpm lint
